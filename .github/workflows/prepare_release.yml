name: Prepare Trixie release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release source and derive metadata
        id: metadata
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          git fetch origin develop --tags
          test "$GITHUB_SHA" = "$(git rev-parse origin/develop)"

          version="$(dpkg-parsechangelog -S Version)"
          tag="v${version}-trixie"
          package_name="satellite1-rpi-setup-trixie"
          package_file="out/public/${package_name}_${version}_arm64.deb"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "Release tag already exists: ${tag}" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "package_name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "package_file=${package_file}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$(basename "${package_file}")" >> "$GITHUB_OUTPUT"

      - name: Restore package cache
        uses: actions/cache@v5
        with:
          path: apt-cache/
          key: ${{ runner.os }}-${{ github.job }}-${{ inputs.image-name }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}
            ${{ runner.os }}

      - name: Set up APT proxy on runner
        run: |
          mkdir -p apt-cache
          sudo apt-get install -y apt-cacher-ng --no-install-suggests --no-install-recommends
          sudo bash -c 'echo "Port: 9999" >> /etc/apt-cacher-ng/acng.conf'
          sudo mv -f apt-cache/* /var/cache/apt-cacher-ng/ || true
          sudo chown -R apt-cacher-ng:apt-cacher-ng /var/cache/apt-cacher-ng
          sudo service apt-cacher-ng restart

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build public setup package
        run: |
          make clean
          make deb BUILD_KIND=public

      - name: Validate release package
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          PACKAGE_NAME: ${{ steps.metadata.outputs.package_name }}
          PACKAGE_FILE: ${{ steps.metadata.outputs.package_file }}
        run: |
          set -euo pipefail
          test -f "$PACKAGE_FILE"
          test "$(dpkg-deb -f "$PACKAGE_FILE" Package)" = "$PACKAGE_NAME"
          test "$(dpkg-deb -f "$PACKAGE_FILE" Version)" = "$VERSION"
          test "$(dpkg-deb -f "$PACKAGE_FILE" Architecture)" = "arm64"

          dependencies="$(dpkg-deb -f "$PACKAGE_FILE" Depends)"
          if [[ "$dependencies" != *"linux-image-"*"-trixie-"* ]]; then
            echo "Package dependency does not target Trixie: $dependencies" >&2
            exit 1
          fi

          dpkg-parsechangelog -S Changes > release-notes.md

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: ${{ steps.metadata.outputs.package_file }}
          if-no-files-found: error

      - name: Create annotated release tag
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.title }}
          draft: true
          body_path: release-notes.md
          files: ${{ steps.metadata.outputs.package_file }}

      - name: Save package cache
        if: always()
        run: |
          mkdir -p apt-cache
          if [ -d "/var/cache/apt-cacher-ng" ]; then
            sudo rm -rf apt-cache/*
            sudo mv -f /var/cache/apt-cacher-ng/* apt-cache/ || true
          fi
