name: Build and release setup package

on:
  push:
    branches:
      - develop
    tags:
      - "v*-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      release_title: ${{ steps.validate-release.outputs.release_title }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore package cache
        uses: actions/cache@v5
        with:
          path: apt-cache/
          key: ${{ runner.os }}-${{ github.job }}-${{ inputs.image-name }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}
            ${{ runner.os }}

      - name: Set up APT proxy on runner
        run: |
          mkdir -p apt-cache
          sudo apt-get install -y apt-cacher-ng --no-install-suggests --no-install-recommends
          sudo bash -c 'echo "Port: 9999" >> /etc/apt-cacher-ng/acng.conf'
          sudo mv -f apt-cache/* /var/cache/apt-cacher-ng/ || true
          sudo chown -R apt-cacher-ng:apt-cacher-ng /var/cache/apt-cacher-ng
          sudo service apt-cacher-ng restart

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true

      - name: Build setup package
        run: |
          make clean
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            if [[ "${{ github.ref_name }}" =~ ^v.+-trixie$ ]]; then
              make deb BUILD_KIND=public
            else
              echo "Trixie release tags must use v<debian-version>-trixie: ${{ github.ref_name }}" >&2
              exit 1
            fi
          else
            make deb BUILD_KIND=local
          fi

      - name: Validate release package
        id: validate-release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(.+)-trixie$ ]]; then
            echo "Trixie release tags must use v<debian-version>-trixie: $RELEASE_TAG" >&2
            exit 1
          fi

          debian_version="${BASH_REMATCH[1]}"
          distribution="trixie"
          changelog_version="$(dpkg-parsechangelog -S Version)"
          package_name="satellite1-rpi-setup-${distribution}"
          package_file="out/public/${package_name}_${debian_version}_arm64.deb"

          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$changelog_version" = "$debian_version"
          test -f "$package_file"
          test "$(dpkg-deb -f "$package_file" Package)" = "$package_name"
          test "$(dpkg-deb -f "$package_file" Version)" = "$debian_version"
          test "$(dpkg-deb -f "$package_file" Architecture)" = "arm64"

          dependencies="$(dpkg-deb -f "$package_file" Depends)"
          if [[ "$dependencies" != *"linux-image-"*"-${distribution}-"* ]]; then
            echo "Package dependency does not target $distribution: $dependencies" >&2
            exit 1
          fi

          echo "release_title=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: satellite1-rpi-setup-deb
          path: out/**/*.deb
          if-no-files-found: error

      - name: Save package cache
        if: always()
        run: |
          mkdir -p apt-cache
          if [ -d "/var/cache/apt-cacher-ng" ]; then
            sudo rm -rf apt-cache/*
            sudo mv -f /var/cache/apt-cacher-ng/* apt-cache/ || true
          fi

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated package
        uses: actions/download-artifact@v7
        with:
          name: satellite1-rpi-setup-deb
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.build.outputs.release_title }}
          generate_release_notes: true
          files: release/*.deb
